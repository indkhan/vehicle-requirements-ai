name: Frontend

on:
  pull_request:
    branches: [main, frontend]
  push:
    branches: [main, frontend, 'codex/portfolio-*']

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '25'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Unit and HTTP contract tests
        run: npm test -- --maxWorkers=2
      - name: Type checking
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install smoke-test browser
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser smoke
        run: npm run test:smoke
      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-smoke-failure
          path: |
            frontend/test-results/smoke
            frontend/playwright-report/smoke
          if-no-files-found: ignore
          retention-days: 7
